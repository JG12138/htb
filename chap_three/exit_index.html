<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>出口 · 任意调酒时间</title>

<style>
:root{
  --bg:#16212B;
  --card:rgba(255,255,255,.07);
  --bd:rgba(255,255,255,.14);
  --txt:#fff;
  --mut:rgba(255,255,255,.72);
  --shadow:0 20px 60px rgba(0,0,0,.45);

  --pink:#FF6FA6;
  --cyan:#68E1FF;
  --lime:#8CFF8A;
  --purple:#B38CFF;
  --gold:#F7D7A8;
}

*{box-sizing:border-box;}
html,body{height:100%;}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}

/* ===== 全屏波浪 SVG 层 ===== */
.bg-waves{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  opacity:.9;
}

/* ===== 全屏彩带 ===== */
.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.confetti i{
  position:absolute;
  top:-20px;
  width:10px;
  height:18px;
  border-radius:2px;
  opacity:.85;
  animation:fall linear infinite;
  left:var(--x);
  animation-duration:var(--t);
  animation-delay:var(--d);
  background:var(--c);
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

/* ===== 内容层 ===== */
.wrap{
  position:relative;
  z-index:5;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(700px,100%);
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:22px;
  padding:28px 24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}

h1{
  margin:0 0 12px 0;
  font-size:24px;
}

p{
  line-height:1.7;
  margin:10px 0;
}

.rule{
  height:1px;
  background:linear-gradient(to right,transparent,rgba(255,255,255,.25),transparent);
  margin:16px 0;
}

.heart{
  width:24px;
  height:24px;
  animation:thump 1.2s ease-in-out infinite;
}

@keyframes thump{
  50%{ transform:scale(1.1); }
}

.actions{
  margin-top:18px;
  display:flex;
  gap:12px;
}

.btn{
  text-decoration:none;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:white;
}

.btn:hover{
  background:rgba(255,255,255,.15);
}
</style>
</head>

<body>

<!-- ===== 全屏波浪背景 ===== -->
<svg class="bg-waves" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="rgba(255,111,166,.0)"/>
      <stop offset="40%" stop-color="rgba(255,111,166,.8)"/>
      <stop offset="70%" stop-color="rgba(104,225,255,.8)"/>
      <stop offset="100%" stop-color="rgba(104,225,255,.0)"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="rgba(140,255,138,.0)"/>
      <stop offset="40%" stop-color="rgba(140,255,138,.7)"/>
      <stop offset="70%" stop-color="rgba(179,140,255,.7)"/>
      <stop offset="100%" stop-color="rgba(179,140,255,.0)"/>
    </linearGradient>
  </defs>

  <path d="M-200 200 C 300 50 800 400 1600 150"
        stroke="url(#g1)" stroke-width="18" fill="none" opacity=".8"/>

  <path d="M-200 400 C 300 200 900 600 1600 350"
        stroke="url(#g2)" stroke-width="14" fill="none" opacity=".8"/>

  <path d="M-200 650 C 400 500 900 850 1600 600"
        stroke="url(#g1)" stroke-width="10" fill="none" opacity=".6"/>
</svg>

<!-- ===== 全屏彩带 ===== -->
<div class="confetti">
  <!-- 多生成一些 -->
  <script>
    const colors = ["#FF6FA6","#68E1FF","#8CFF8A","#B38CFF","#F7D7A8"];
    for(let i=0;i<60;i++){
      const el=document.createElement("i");
      el.style.setProperty("--x", Math.random()*100+"%");
      el.style.setProperty("--t", (3+Math.random()*3)+"s");
      el.style.setProperty("--d", (-Math.random()*5)+"s");
      el.style.setProperty("--c", colors[Math.floor(Math.random()*colors.length)]);
      document.querySelector(".confetti").appendChild(el);
    }
  </script>
</div>

<!-- ===== 内容卡片 ===== -->
<div class="wrap">
  <div class="card">
    <h1>哇塞！恭喜你们！你们走出来了！！</h1>
    <p>现在可以安分地享受酒品了。</p>

    <div class="rule"></div>

    <p><strong>任意调酒时间。</strong> 想喝什么就喝什么!</p>
    <p>今晚不再有规则——哎？我们玩的有很过分吗？</p>

    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
      <svg class="heart" viewBox="0 0 24 24">
        <path fill="rgba(255,111,166,.95)" 
        d="M12 21s-7.2-4.6-9.7-9C.6 8.7 2.2 5.8 5.3 5.2c1.7-.3 3.3.4 4.2 1.7.9-1.3 2.6-2 4.2-1.7 3.1.6 4.7 3.5 3 6.8-2.5 4.4-9.7 9-9.7 9z"/>
      </svg>
      <p style="margin:0;">情人节快乐哦？</p>
    </div>

    <div class="actions">
      <a class="btn" href="../index.html">返回</a>
    </div>
  </div>
</div>

</body>
</html>
