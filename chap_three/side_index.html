<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>?????????</title>
  <style>
:root{
  --bg:#0b0c0d;
  --card:rgba(255,255,255,.045);
  --bd:rgba(255,255,255,.10);
  --txt:rgba(255,255,255,.88);
  --mut:rgba(255,255,255,.55);

  --btn:rgba(255,255,255,.06);
  --btn2:rgba(255,255,255,.11);

  --shadow:0 18px 50px rgba(0,0,0,.55);

  --cell:24px;
  --gap:4px;
  --round:16px;
}

/* ===== 基础 ===== */
*{ box-sizing:border-box; }
html,body{ height:100%; }
.hidden{ display:none !important; }
.mut{ color:var(--mut); }

body{
  margin:0;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(1200px 700px at 55% 35%, rgba(255,255,255,.06), rgba(0,0,0,0) 60%),
    radial-gradient(900px 520px at 35% 70%, rgba(255,255,255,.04), rgba(0,0,0,0) 65%),
    linear-gradient(180deg, #070809, #0b0c0d 60%, #060607);

  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;

  filter:saturate(.55) contrast(1.05);
  position:relative;
  overflow:hidden;
}

/* ===== 雾/噪点层 ===== */
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(1200px 900px at 50% 40%, rgba(255,255,255,.06), rgba(0,0,0,0) 58%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(900px 700px at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.78) 100%);
  mix-blend-mode:overlay;
  opacity:.55;
  transform:rotate(-2deg);
  animation:fogShift 9s ease-in-out infinite;
}

@keyframes fogShift{
  0%{ transform:translate3d(-1%, -1%, 0) rotate(-2deg); opacity:.50; }
  50%{ transform:translate3d(1.2%, 0.6%, 0) rotate(-1deg); opacity:.62; }
  100%{ transform:translate3d(-1%, -1%, 0) rotate(-2deg); opacity:.50; }
}

/* ===== 卡片 ===== */
.card{
  position:relative;
  z-index:1;
  width:min(94vw, 980px);

  background:
    radial-gradient(520px 240px at 30% 20%, rgba(255,255,255,.06), rgba(255,255,255,0) 60%),
    rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.10);
  border-radius:var(--round);
  box-shadow:var(--shadow);
  backdrop-filter: blur(10px) saturate(.75);
  padding:18px;
  overflow:hidden;
}

/* ===== 常用布局类 ===== */
.row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}

.pill{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.75);
}

.desc{
  white-space:pre-line;
  line-height:1.55;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px;
  margin:12px 0;
}

.layout{
  display:grid;
  grid-template-columns: 1fr auto;
  gap:18px;
  align-items:start;
}
@media (max-width: 820px){
  .layout{ grid-template-columns: 1fr; }
}

/* ===== 按钮 ===== */
button{
  appearance:none;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.055);
  color:rgba(255,255,255,.86);
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.35);
  transition:transform .08s ease, background .12s ease, border-color .12s ease;
}
button:hover{
  background:rgba(255,255,255,.095);
  border-color:rgba(255,255,255,.18);
}
button:active{ transform:translateY(1px); }
button:disabled{
  opacity:.42;
  cursor:not-allowed;
  transform:none;
}

/* 补齐你用到但没写的类 */
.pickBtn{ padding:10px 12px; border-radius:12px; }
.btnTiny{ padding:8px 10px; border-radius:10px; font-size:12px; }
.kbd{
  display:inline-block;
  padding:2px 6px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  background:rgba(255,255,255,.06);
}

/* ===== 移动按钮 ===== */
.pad{
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto auto auto;
  gap:10px;
  margin-top:12px;
}
.pad .up   { grid-column:2; grid-row:1; }
.pad .left { grid-column:1; grid-row:2; }
.pad .right{ grid-column:3; grid-row:2; }
.pad .down { grid-column:2; grid-row:3; }
.pad .home { grid-column:1 / span 3; grid-row:4; }
.pad .back { grid-column:1 / span 3; grid-row:5; }

/* ===== Map ===== */
.mapWrap{
  padding:12px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  background:rgba(0,0,0,.28);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  width: calc(10 * var(--cell) + 9 * var(--gap) + 24px);
}
@media (max-width: 820px){
  .mapWrap{ width:100%; }
}
.mapTitle{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.map{
  display:grid;
  grid-template-columns: repeat(10, var(--cell));
  grid-template-rows: repeat(10, var(--cell));
  gap: var(--gap);
  padding: 12px;
  border-radius: 12px;
  background: rgba(0,0,0,.18);
}
.cell{
  width: var(--cell);
  height: var(--cell);
  border-radius:5px;
  background:rgba(255,255,255,.02);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  transition:transform .12s ease, filter .12s ease, background .12s ease;
  position:relative;
}
.cell.n-open,
.cell.t-open{
  background:rgba(255,255,255,.14);
  outline:1px solid rgba(255,255,255,.18);
}
.cell.l-open{
  background:rgba(120,240,255,.16);
  outline:1px dashed rgba(120,240,255,.42);
}
.cell.l-locked{
  background:rgba(120,240,255,.07);
  outline:1px dashed rgba(120,240,255,.26);
}
.cell.here{
  background:#00e5ff;
  box-shadow:0 0 8px rgba(0,229,255,.55);
}

/* ===== Modal ===== */
.modal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.62);
  backdrop-filter: blur(10px) saturate(.7);
  z-index:9999;
}
.modalBox{
  width:min(520px, 92vw);
  background:
    radial-gradient(380px 180px at 30% 20%, rgba(255,255,255,.06), rgba(255,255,255,0) 60%),
    rgba(12,13,14,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  box-shadow:0 22px 70px rgba(0,0,0,.62);
  padding:14px;
}
.modalTitle{ font-weight:700; margin-bottom:8px; }
.modalBody{ color:rgba(255,255,255,.84); white-space:pre-line; }
.modalActions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:12px;
}
  </style>
</head>

<body>
  <div class="card">

    <!-- Picker -->
    <div id="picker">
      <div class="topline">
        <h2 style="margin:0;">Name picker</h2>
        <div class="pill">谷仓..?</div>
      </div>
      <div class="mut">你是谁？你要离开这里吗？</div>

      <div class="row" id="pickerBtns" style="margin-top:12px;"></div>

      <div class="mut" style="margin-top:10px;">
        走法：<span class="kbd">↑↓←→</span> 或点按钮。每步都能 <span class="kbd">Back</span> 回退。
        外面起雾了，这里也起雾了吗？
      </div>
    </div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalBox">
    <div class="modalTitle" id="modalTitle">提示</div>
    <div class="modalBody" id="modalBody">...</div>
    <div class="modalActions">
      <button id="modalCancel" type="button">取消</button>
      <button id="modalOk" type="button">确定</button>
    </div>
  </div>
</div>
    <!-- Game -->
    <div id="game" class="hidden">
      <div class="layout">

        <div>
          <div class="topline">
            <div>
              <h2 id="title" style="margin:0;">谷仓迷宫</h2>
              <div class="mut" id="subline"></div>
            </div>
            <div class="row">
              <button id="keyBtn" class="btnTiny hidden" type="button" title="只有部分名字会看到这个按钮">🔑</button>
              <button class="btnTiny" type="button" onclick="resetToStart()">回到起始点</button>
            </div>
          </div>

          <div class="desc" id="desc"></div>

          <div class="pad" id="moveBtns"></div>

          <div class="mut" style="margin-top:10px;">
           你看到亮的，就是你“现在能走到”的前后左右。
          </div>
        </div>

        <div class="mapWrap">
          <div class="mapTitle">
            <div style="font-weight:600;">Map 10×10</div>
            <div class="mut" id="mapHint">邻接亮格</div>
          </div>
          <div class="map" id="map"></div>
          <div class="mut" style="margin-top:10px;">
            当前格最亮；周围能走的格子会亮。
          </div>
        </div>

      </div>

    </div>

  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

     const peopleDB= { 
  "橙知": { key:false },
  "丹": { key:false },
  "Eric": { key:false },
  "Ethan": { key:false },
  "阿基米德": { key:false },
  "Friedrich": { key:false },
  "Honey": { key:false },
  "J.O.": { key:true },          // ✅
  "Kazares": { key:false },
  "奥利弗": { key:true },        // ✅
  "Matt": { key:false },
  "Mubiru": { key:false },
  "Samuel": { key:false },
  "Thomas": { key:false },
  "卡莱比": { key:false },
  "叶澄希": { key:false },

  "Amber": { key:false },
  "Cela": { key:false },
  "Jeffrey": { key:true },       // ✅
  "玛顿": { key:false },
  "Maya": { key:true },          // ✅
  "马塞拉": { key:false },
  "Melusine": { key:false },
  "Naya": { key:true },          // ✅
  "Romaine": { key:false },
  "向林木": { key:true },        // ✅
  "奈芙": { key:false },
  "Zurabia": { key:false },
  "Moira": { key:false },
  "Erla": { key:false },
  "Josephine": { key:false },
  "Oliven": { key:false }
};

function isEnglish(name){
  return /^[A-Za-z.\s]+$/.test(name);
}

const allNames = Object.keys(peopleDB);

// 中文在前（保持原顺序）
const chineseNames = allNames.filter(n => !isEnglish(n));

// 英文在后（A-Z）
const englishNames = allNames
  .filter(n => isEnglish(n))
  .sort((a,b) => a.localeCompare(b, "en"));

const SORTED_NAMES = [...chineseNames, ...englishNames];

const NAMES_DB = SORTED_NAMES.map(name => ({
  name,
  key: peopleDB[name].key,
  note: peopleDB[name].key ? "" : ""
}));


  function renderPicker(){
    const box = $("pickerBtns");
    if(!box) return;
    box.innerHTML = "";
    for(const p of NAMES_DB){
      const b = document.createElement("button");
      b.className = "pickBtn";
      b.type = "button";
      b.textContent = `${p.name}（${p.note}）`;
      b.addEventListener("click", ()=> startGame(p.name));
      box.appendChild(b);
    }
  }

  function setPickerEnabled(on){
    document.querySelectorAll("#picker .pickBtn").forEach(btn=>{
      btn.disabled = !on;
    });
  }

  /* ===== Modal helper ===== */
  let modalResolve = null;
  let modalStage = 0;

  function closeModal(result){
    const modal = $("modal");
    if(!modal) return;
    modal.classList.add("hidden");
    modalStage = 0;

    if(modalResolve){
      const r = modalResolve;
      modalResolve = null;
      r(result);
    }
  }

  function openModal({
    title="提示",
    body="",
    okText="确定",
    cancelText="取消",
    danger=false,
    scareOnCancel=false,
    scareTitle="……",
    scareBody="这里是哪里？",
    scareOkText="……",
    scareCancelText="继续",
    // 关键：避免“我点到遮罩所以一闪而过”
    closeOnOverlay=false,
  }){
    const modal = $("modal");
    const titleEl = $("modalTitle");
    const bodyEl  = $("modalBody");
    const okBtn   = $("modalOk");
    const cancelBtn = $("modalCancel");

    if(!modal || !titleEl || !bodyEl || !okBtn || !cancelBtn){
      console.error("Modal DOM missing:", {modal, titleEl, bodyEl, okBtn, cancelBtn});
      return Promise.resolve(false);
    }

    modalStage = 0;

    titleEl.textContent = title;
    bodyEl.textContent = body;

    okBtn.textContent = okText;
    cancelBtn.textContent = cancelText;

    okBtn.style.outline = danger ? "1px solid rgba(255,90,90,.55)" : "";
    okBtn.style.background = danger ? "rgba(255,90,90,.16)" : "";

    okBtn.onclick = null;
    cancelBtn.onclick = null;
    modal.onclick = null;

    const box = modal.querySelector(".modalBox");
    if(box) box.onclick = (e)=>e.stopPropagation();

    okBtn.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      closeModal(true);
    };

    cancelBtn.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();

      if(scareOnCancel && modalStage === 0){
        modalStage = 1;
        titleEl.textContent = scareTitle;
        bodyEl.textContent  = scareBody;
        okBtn.textContent   = scareOkText;
        cancelBtn.textContent = scareCancelText;
        return;
      }
      closeModal(false);
    };

    if(closeOnOverlay){
      modal.onclick = ()=> cancelBtn.click();
    }

    document.addEventListener("keydown", function onEsc(ev){
      if(ev.key === "Escape") cancelBtn.click();
    }, { once:true });

    modal.classList.remove("hidden");
    return new Promise((resolve)=>{ modalResolve = resolve; });
  }


  /* ===== 迷宫数据 ===== */
  const GRID_STR = [
    "###T##T###",
    "#T#TTTTTNN",
    "TTTT#T##N#",
    "#T#NNN##NT",
    "TT#N#NNNN#",
    "#T#N##T#T#",
    "#NNNN#T#T#",
    "##N#NTTTTT",
    "##NNN#T#TT",
    "TTT#####T#",
  ];

  const LOCKED_DOORS = [
    [[3,1],[4,1]],
    [[7,1],[8,1]],
    [[1,1],[1,2]],
    [[5,2],[5,3]],
    [[3,2],[3,3]],
    [[8,4],[8,5]],
    [[4,7],[5,7]],
    [[6,7],[7,7]],
  ];

  const START = [1,6];
  const EXIT  = [9,1];
  const EXIT_URL = "./next_page.html";

  let exitPrompted = false;
  let exitAsking = false;

  const W=10, H=10;
  function inb(x,y){ return x>=0 && x<W && y>=0 && y<H; }
  function cellType(x,y){ return GRID_STR[y]?.[x] ?? "#"; }
  function isWalkCell(x,y){ const t=cellType(x,y); return t==="N" || t==="T"; }

  const LOCK = new Set();
  for(const [a,b] of LOCKED_DOORS){
    const [x1,y1]=a,[x2,y2]=b;
    LOCK.add(`${x1},${y1}|${x2},${y2}`);
    LOCK.add(`${x2},${y2}|${x1},${y1}`);
  }
  function isLockedEdge(x,y,nx,ny){ return LOCK.has(`${x},${y}|${nx},${ny}`); }

  function canStep(x,y,nx,ny, canOpenLocks){
    if(!inb(nx,ny)) return false;
    if(Math.abs(nx-x)+Math.abs(ny-y)!==1) return false;
    if(!isWalkCell(nx,ny)) return false;
    if(isLockedEdge(x,y,nx,ny) && !canOpenLocks) return false;
    return true;
  }

  function neighborsInfo(x,y, canOpenLocks){
    const dirs = [
      {k:"U", label:"↑ 上", nx:x, ny:y-1},
      {k:"D", label:"↓ 下", nx:x, ny:y+1},
      {k:"L", label:"← 左", nx:x-1, ny:y},
      {k:"R", label:"→ 右", nx:x+1, ny:y},
    ];
    return dirs.map(d=>{
      if(!inb(d.nx,d.ny)) return {...d, exists:false, cell:"#", locked:false, ok:false};
      const t = cellType(d.nx,d.ny);
      const locked = isLockedEdge(x,y,d.nx,d.ny);
      const ok = canStep(x,y,d.nx,d.ny, canOpenLocks);
      return {...d, exists:true, cell:t, locked, ok};
    });
  }

  const S = {
    name:null,
    hasKey:false,
    keysLeft:0,
    pos:[...START],
    history:[],
    exploded:false,
    fail:0,
    flashMsg:"",
  };

  /* ===== map init（加 null 保护） ===== */
  const mapEl = $("map");
  const cells = [];
  if(mapEl){
    for(let y=0;y<10;y++){
      for(let x=0;x<10;x++){
        const d=document.createElement("div");
        d.className="cell";
        mapEl.appendChild(d);
        cells.push(d);
      }
    }
  }else{
    console.error("#map not found");
  }
  function cellAt(x,y){ return cells[y*10 + x]; }

  function updateMapAdj(){
    if(!cells.length) return;

    cells.forEach(c=>c.classList.remove("here","n-open","t-open","l-open","l-locked"));
    const [x,y]=S.pos;
    cellAt(x,y)?.classList.add("here");

    const ns = neighborsInfo(x, y, S.keysLeft > 0);
    for(const n of ns){
      if(!n.exists) continue;
      if(n.cell==="#") continue;
      const c = cellAt(n.nx,n.ny);
      if(!c) continue;

      if(n.locked){
        if(n.ok) c.classList.add("l-open");
        else c.classList.add("l-locked");
      }else{
        if(n.cell==="N") c.classList.add("n-open");
        if(n.cell==="T") c.classList.add("t-open");
      }
    }
  }

  function startGame(name){
    S.name = name;
    const p = NAMES_DB.find(v=>v.name===name);
    S.hasKey = !!p?.key;
    S.keysLeft = S.hasKey ? 3 : 0;

    S.pos=[...START];
    S.history=[];
    S.exploded=false;
    S.fail=0;
    S.flashMsg="";

    $("picker")?.classList.add("hidden");
    $("game")?.classList.remove("hidden");

    const keyBtn = $("keyBtn");
    if(keyBtn){
      keyBtn.classList.toggle("hidden", !S.hasKey);
      keyBtn.disabled = true;
    }

    exitPrompted = false;
    exitAsking = false;
    render();
  }
  window.startGame = startGame;

  function resetToStart(){
    S.pos=[...START];
    S.history=[];
    S.exploded=false;
    S.flashMsg="";
    exitPrompted = false;
    exitAsking = false;
    render();
  }
  window.resetToStart = resetToStart;

  function boom(msg){
    S.exploded=true;
    S.fail++;
    S.flashMsg="";
    const desc = $("desc");
    if(desc){
      desc.textContent = msg + "\n\n你可以回起始点，或者（如果你还有 Back）先后退离开这个位置。";
    }
    renderButtonsAfterBoom();
    updateMapAdj();
  }

  async function tryMove(dir){
    const [x,y]=S.pos;
    const ns = neighborsInfo(x, y, S.keysLeft > 0);
    const n = ns.find(v=>v.k===dir);

    if(!n || !n.exists || n.cell==="#"){
      return boom("你摸到了一面实心墙。谷仓里有东西在笑。");
    }

    if(n.locked && S.keysLeft <= 0){
      return boom("门把手拧不动。锁孔里像有眼睛。你眨了一下——不对，是它眨了。");
    }

    if(n.locked && S.keysLeft > 0){
      const ok = await openModal({
        title: "门",
        body: `前方是上锁的门。\n要使用万能钥匙开门吗？\n（剩余 ${S.keysLeft}/3）`,
        okText: "使用钥匙",
        cancelText: "先不",
        closeOnOverlay: false,
      });

      if(!ok){
        S.flashMsg = "你把手收了回来。门那边很安静。";
        render();
        return;
      }

      S.keysLeft = Math.max(0, S.keysLeft - 1);
      S.history.push([x,y]);
      S.pos=[n.nx,n.ny];
      S.exploded=false;

      S.flashMsg = (S.keysLeft === 0)
        ? "咔哒。门开了。\n\n你手里的万能钥匙发出一声脆响，断了。"
        : "咔哒。门开了。";

      render();
      return;
    }

    if(n.ok){
      S.history.push([x,y]);
      S.pos=[n.nx,n.ny];
      S.exploded=false;
      S.flashMsg="";
      render();
      return;
    }

    return boom("你走错了。");
  }

  function backStep(){
    if(S.history.length===0) return;
    const prev = S.history.pop();
    S.pos=[...prev];
    S.exploded=false;
    S.flashMsg="";
    render();
  }

  function atExit(){
    const [x,y]=S.pos;
    return x===EXIT[0] && y===EXIT[1];
  }

  function renderMoveButtons(){
    const wrap = $("moveBtns");
    if(!wrap) return;
    wrap.innerHTML = "";

    const [x,y]=S.pos;
    const ns = neighborsInfo(x, y, S.keysLeft > 0);
    const order = [
      {k:"U", cls:"up"},
      {k:"L", cls:"left"},
      {k:"D", cls:"down"},
      {k:"R", cls:"right"},
    ];

    for(const item of order){
      const n = ns.find(v=>v.k===item.k);
      const b = document.createElement("button");

      let tag="";
      if(!n.exists || n.cell==="#") tag="（墙）";
      else if(n.locked && S.keysLeft <= 0) tag="（锁）";

      b.textContent = `${n.label} ${tag}`;
      b.className = item.cls;
      b.onclick = ()=>tryMove(n.k);
      wrap.appendChild(b);
    }

    const back=document.createElement("button");
    back.textContent = `Back（后退）`;
    back.className = "back";
    back.disabled = S.history.length===0;
    back.onclick = backStep;
    wrap.appendChild(back);
  }

  function renderButtonsAfterBoom(){
    const wrap = $("moveBtns");
    if(!wrap) return;
    wrap.innerHTML = "";

    const home = document.createElement("button");
    home.textContent = "原路返回到起点。";
    home.className = "home";
    home.onclick = resetToStart;
    wrap.appendChild(home);

    const back = document.createElement("button");
    back.textContent = "Back（后退）";
    back.className = "back";
    back.disabled = S.history.length===0;
    back.onclick = backStep;
    wrap.appendChild(back);
  }

  function render(){
    const subline = $("subline");
    const desc = $("desc");

    const keyState = S.hasKey ? `万能钥匙：${S.keysLeft}/3` : "无钥匙";
    const [x,y]=S.pos;

    if(subline) subline.textContent = `name: ${S.name} · pos: (${x},${y}) · fail: ${S.fail} · ${keyState}`;

    if(atExit() && !S.exploded){
      if(desc){
        desc.textContent = "你走到了出口！\n\n（点确定离开；点取消可以继续乱走，或者回起始点再试。）";
      }

      if(!exitPrompted && !exitAsking){
        exitPrompted = true;
        exitAsking = true;

        openModal({
          title: "出口",
          body: "你走到了出口！\n现在离开迷宫吗？",
          okText: "离开",
          cancelText: "继续走",
          closeOnOverlay: false,
        }).then((ok)=>{
          exitAsking = false;
          if(ok) window.location.href = EXIT_URL;
        });
      }
    }else{
      exitPrompted = false;
      exitAsking = false;

      if(!S.exploded && desc){
        if(S.flashMsg){
          desc.textContent = S.flashMsg;
          S.flashMsg = "";
        }else{
          const t=cellType(x,y);
          const vibe = (t==="N")
            ? "脚下的路很稳，像有人刻意铺出来的。"
            : "脚下是干燥的木板路，尘土很轻。";

          const ns = neighborsInfo(x, y, S.keysLeft > 0).filter(n => n.exists && n.cell !== "#");
          const hint = ns.map(n=>{
            if(n.locked) return `${n.label}(锁)`;
            return `${n.label}(路)`;
          }).join(" · ") || "四面都是墙。";

          desc.textContent = `你在谷仓迷宫里。\n${vibe}\n\n可走方向：${hint}`;
        }
      }
    }

    if(S.exploded) renderButtonsAfterBoom();
    else renderMoveButtons();

    updateMapAdj();

    const keyBtn = $("keyBtn");
    if(keyBtn){
      if(S.hasKey){
        keyBtn.textContent = `万能钥匙：${S.keysLeft}/3`;
        keyBtn.classList.toggle("hidden", false);
      }else{
        keyBtn.classList.toggle("hidden", true);
      }
    }
  }

  document.addEventListener("keydown",(e)=>{
    if($("game")?.classList.contains("hidden")) return;
    const k=e.key;
    if(k==="ArrowUp") return tryMove("U");
    if(k==="ArrowDown") return tryMove("D");
    if(k==="ArrowLeft") return tryMove("L");
    if(k==="ArrowRight") return tryMove("R");
    if(k==="Backspace" || k==="z" || k==="Z") return backStep();
  });

  /* ===== 开场弹窗：选名字之前 ===== */
  window.addEventListener("DOMContentLoaded", async ()=>{
    console.log("DOM ready -> renderPicker + openModal");

    renderPicker();
    setPickerEnabled(false);

    const ok = await openModal({
      title: "停电了。",
      body: "你听见谷仓里有脚步声。\n\n说起来室内也会起雾吗？",
      okText: "？",
      cancelText: "……",
      scareOnCancel: true,
      scareTitle: "别回头",
      scareBody: "似乎有门在你不远处关上了。",
      scareOkText: "继续",
      scareCancelText: "继续",
      closeOnOverlay: false, // 关键：避免一闪而过
    });

    console.log("opening modal resolved:", ok);
    setPickerEnabled(true);
  });

})();
</script>
</body>
</html>
