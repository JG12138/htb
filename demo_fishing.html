<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Heart to Beat · Fishing (Demo)</title>

  <style>
:root{
  --bg:#1A2733;
  --card:rgba(255,255,255,.06);
  --bd:rgba(255,255,255,.12);
  --txt:#fff;
  --mut:rgba(255,255,255,.72);
  --btn:rgba(255,255,255,.10);
  --btn2:rgba(255,255,255,.16);
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg);
  color:var(--txt);
  display:flex;
  justify-content:center;
}

body::before{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:-1;
  background:
    radial-gradient(circle at 30% 40%, rgba(120,180,200,.10), transparent 55%),
    radial-gradient(circle at 70% 60%, rgba(80,140,180,.08), transparent 60%);
  animation: waterMove 26s linear infinite;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:-15%;
  z-index:-1;
  background:
    repeating-linear-gradient(
      120deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 2px,
      transparent 6px,
      transparent 14px
    );
  animation: ripple 18s linear infinite;
  mix-blend-mode:overlay;
  pointer-events:none;
}

@keyframes ripple{
  from{ transform:translateX(0); }
  to{ transform:translateX(-80px); }
}

.wrap{
  width:min(980px,100%);
  padding:clamp(14px,3vw,28px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

h2{ margin:0; font-size:clamp(18px,3.6vw,28px); }
.subtitle{ color:var(--mut); font-size:12.5px; margin-top:2px; }

.layout{
  display:grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap:12px;
  align-items:start;
}

.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:14px;
}

label{
  display:block;
  font-size:12px;
  color:var(--mut);
  margin-bottom:6px;
}

.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > div{ flex:1; min-width:160px; }

input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--bd);
  background:rgba(0,0,0,.12);
  color:var(--txt);
  border-radius:8px;
  outline:none;
}

input:disabled{
  opacity:1;
  cursor:default;
  background:rgba(0,0,0,.18);
  border-color:var(--bd);
  color:rgba(255,255,255,.85);
}

button{
  border:1px solid var(--bd);
  background:var(--btn);
  color:var(--txt);
  padding:11px 12px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
}
button:hover{ background:var(--btn2); }
button.primary{ background:rgba(255,255,255,.18); font-weight:600; }
button:disabled{ opacity:.45; cursor:not-allowed; }

.center{ text-align:center; }
.hidden{ display:none; }

hr{
  border:none;
  border-top:1px solid var(--bd);
  margin:10px 0;
}

.muted{ color:var(--mut); font-size:12px; }

/* 右侧战绩 */
.sideTitle{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  margin-bottom:10px;
}

ul.log{
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.logItem{
  padding:10px 12px;
  border:1px solid var(--bd);
  border-radius:10px;
  background:rgba(0,0,0,.10);
  line-height:1.45;
  font-size:13px;
}

.pill{
  display:inline-block;
  font-size:12px;
  padding:2px 8px;
  border:1px solid var(--bd);
  border-radius:999px;
  color:var(--mut);
  margin-right:8px;
  background:rgba(0,0,0,.10);
}

.pill.success{
  color:#6fdc8c;
  border-color:#2f6f4f;
  background:rgba(111,220,140,0.08);
}
.pill.fail{
  color:#ff6b6b;
  border-color:#7a2f2f;
  background:rgba(255,107,107,0.08);
}

/* mobile */
@media (max-width:860px){
  .layout{ display:flex; flex-direction:column; gap:12px; }
}

@keyframes waterMove{
  0%{ transform:translate(0,0); }
  50%{ transform:translate(-3%, -2%); }
  100%{ transform:translate(0,0); }
}

/* 抛竿水波 */
.ripple{
  position:fixed;
  left:50%;
  top:50%;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
  transform:translate(-50%,-50%) scale(0.2);
  opacity:.6;
  pointer-events:none;
  z-index:-1; /* 在卡下背景 */
  animation:rippleExpand 1.2s ease-out forwards;
}

@keyframes rippleExpand{
  0%{ transform:translate(-50%,-50%) scale(0.2); opacity:.6; }
  100%{ transform:translate(-50%,-50%) scale(8); opacity:0; }
}

/* 轻微摇晃 */
.shake-soft{ animation: shakeSoft .45s ease-out; }
@keyframes shakeSoft{
  0%{ transform: translateX(0); }
  20%{ transform: translateX(-4px); }
  40%{ transform: translateX(4px); }
  60%{ transform: translateX(-2px); }
  80%{ transform: translateX(2px); }
  100%{ transform: translateX(0); }
}
  </style>
</head>

<body>
  <div class="wrap">
    <div>
      <h2>哎呦，钓鱼佬又来赌博了。</h2>
      <div class="subtitle">湖边 · Demo（不保存数据，刷新就没）</div>
    </div>

    <div class="layout">
      <!-- 左侧主区 -->
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div class="card">
          <label>你的名字（可不填）</label>
          <input id="pName" placeholder="比如：路过 / 神秘钓鱼佬 / 你随便写">

          <div class="row" style="margin-top:10px;">
            <div>
              <label>现在耐心如何？（1–10，可不填）</label>
              <input id="pPat" type="number" min="1" max="10" placeholder="默认 3">
            </div>
            <div>
              <label>还有力气吗？（1–10，可不填）</label>
              <input id="pStr" type="number" min="1" max="10" placeholder="默认 3">
            </div>
          </div>

          <div class="center" style="margin-top:12px; display:flex; gap:10px; justify-content:center; align-items:center;">
            <button id="castBtn" class="primary" onclick="fish()">抛竿</button>
            <button id="quitBtn" onclick="quitNow()">不玩了！</button>
          </div>

          <div class="muted" style="margin-top:10px;">
            今日抛竿次数：<span id="castsLeft">5</span> / 5
          </div>

          <div class="muted" style="margin-top:8px;">
            Demo版不会保存记录；想炫耀请截图（节目组不负责存档）。
          </div>
        </div>

        <!-- 钓鱼结果 -->
        <div id="result" class="card hidden"></div>

        <!-- 帮忙选择 -->
        <div id="helpBox" class="card hidden center">
          <div style="margin-bottom:10px;">
            老天，这是什么运气？！<br>
            但这条鱼太大了，要不要找人帮忙？
          </div>

          <div class="muted" style="margin-bottom:8px; font-size:12px;">
            我都给你机会和别人互动了（你最好把握一下）。
          </div>

          <input id="helperName" placeholder="输入帮手名字（随便写）">

          <div style="margin-top:10px;">
            <button onclick="resolve(true)">找人帮忙！</button>
            <button onclick="resolve(false)">我非要自己来。</button>
          </div>
        </div>

        <!-- 结算 -->
        <div id="endBox" class="card hidden center">
          <div style="margin-bottom:10px;">
            时间差不多了，总不能钓一天鱼吧？！
          </div>
          <button onclick="fishAllDay()">我非要钓一天</button>
          <button onclick="wrapUp()">算了，差不多收拾一下要回去了。</button>
        </div>
      </div>

      <!-- 右侧记录区 -->
      <div class="card">
        <div class="sideTitle">
          <div>今日战绩</div>
          <div class="muted">最近在上面</div>
        </div>
        <ul id="log" class="log"></ul>
      </div>
    </div>
  </div>

<script>


/* no db */

const fishingSpot = {
  name: "湖边",
  fishPool: [
    // 常见
    { name:"小鲤鱼", min:18, max:40 },
    { name:"草鱼",   min:28, max:75 },
    { name:"鲫鱼",   min:15, max:35 },
    { name:"鳊鱼",   min:18, max:45 },
    { name:"罗非鱼", min:22, max:55 },

    // 稍稀有
    { name:"黑鱼",   min:45, max:110 },
    { name:"鲶鱼",   min:35, max:120 },
    { name:"鳜鱼",   min:25, max:70 },
    { name:"虹鳟",   min:30, max:85 },
    { name:"翘嘴",   min:28, max:90 },

    // 彩蛋
    { name:"锦鲤（疑似来串场）", min:20, max:60 },
    { name:"传说中的银鳞鱼",     min:50, max:140 },
    { name:"塑料袋（不是鱼）",   min:10, max:25 },
    { name:"破旧鱼线团",         min:8,  max:18 }
  ]
};

let currentFish = null;
let player = {};
let castsLeft = 5;

// prob
const CATCH_PROB = 2/5;

let locked = false;

const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const $ = (id)=>document.getElementById(id);

function show(el){ el.classList.remove("hidden"); }
function hide(el){ el.classList.add("hidden"); }
function setCastEnabled(enabled){ $("castBtn").disabled = !enabled; }
function setQuitEnabled(enabled){ $("quitBtn").disabled = !enabled; }

function updateCastsUI(){ $("castsLeft").textContent = String(castsLeft); }

function addLogItem(html){
  const li = document.createElement("li");
  li.className = "logItem";
  li.innerHTML = html;
  $("log").prepend(li);
}

/* 锁输入 */
function lockPlayerInputs(){
  $("pName").disabled = true;
  $("pPat").disabled  = true;
  $("pStr").disabled  = true;
  locked = true;
}

/* 顶掉 */
function showFishingUI(){
  hide($("endBox"));
  hide($("helpBox"));
  show($("result"));
}
function showEndUI(){
  hide($("result"));
  hide($("helpBox"));
  show($("endBox"));
}

/* 抛竿水波 */
function spawnRipple(){
  const r = document.createElement("div");
  r.className = "ripple";
  document.body.appendChild(r);
  r.addEventListener("animationend", () => r.remove());
}

/* Ihate this*/
function readStat(inputId, fallback = 3){
  const raw = $(inputId).value.trim();

  if(raw === "") return fallback;

  const n = Number(raw);

  // NaN/Infinity =默认
  if(!Number.isFinite(n)) return fallback;

  const rounded = Math.round(n);
  return Math.min(10, Math.max(1, rounded));
}

/* 主流程 */
function fish(){
  spawnRipple();

  const resultEl = $("result");
  const helpEl = $("helpBox");

  if(castsLeft <= 0){
    showEndUI();
    return;
  }

  showFishingUI();
  resultEl.innerHTML = "";
  currentFish = null;
  $("helperName").value = "";

  // 名字：纯展示
  player.name = $("pName").value.trim() || "路过观众";

  player.pat = readStat("pPat", 3);
  player.str = readStat("pStr", 3);

  if(!locked) lockPlayerInputs();

  castsLeft -= 1;
  updateCastsUI();

  const caught = Math.random() < CATCH_PROB;

  if(!caught){
    const patText =
      player.pat <= 3 ? "你很快就开始烦了。" :
      player.pat <= 7 ? "你耐着性子等了一会儿。" :
      "你非常有耐心，几乎不动声色。";

    resultEl.innerHTML = `
      <div><b>空军。</b></div>
      <div>${patText}</div>
      <div>你盯着水面看了半天：水面盯着你看了半天。</div>
    `;

    addLogItem(`
      <div><span class="pill">空军</span>${player.name}：什么都没钓到。</div>
    `);

    // 保险：确保 quit 一直可点
    setQuitEnabled(true);

    return;
  }

  const f = fishingSpot.fishPool[rnd(0, fishingSpot.fishPool.length-1)];
  const length = rnd(f.min, f.max);

  // 非鱼类彩蛋不走拉鱼判定
  const isJunk = /塑料袋|鱼线团/.test(f.name);

  if(isJunk){
    resultEl.innerHTML = `
      <div>你在 ${fishingSpot.name} 捞到：<b>${f.name}</b></div>
      <div class="muted">长度：${length} cm（……这也算战绩吗？）</div>
      <hr>
      <b>你赢了：节目效果。</b>
    `;
    addLogItem(`
      <div>
        <span class="pill">节目效果</span>
        ${player.name}：${f.name}（${length}cm）
      </div>
    `);

    setQuitEnabled(true);
    return;
  }

  currentFish = { name: f.name, length, need: Math.ceil(length/20) };

  resultEl.innerHTML = `
    <div>你在 ${fishingSpot.name} 钓到一条 <b>${currentFish.name}</b></div>
    <div>长度：${length} cm</div>
  `;

  if(length >= 60){
    show(helpEl);

    setQuitEnabled(false);
    setCastEnabled(false);

    // 摇
    helpEl.classList.remove("shake-soft");
    void helpEl.offsetWidth;
    helpEl.classList.add("shake-soft");

    $("helperName").focus();
  }else{
    resolve(false);
  }
}

function resolve(withHelp){
  const resultEl = $("result");
  const helpEl = $("helpBox");

  if(!currentFish || typeof currentFish.length !== "number"){
    alert("这会儿没鱼可拉。");
    hide(helpEl);
    setQuitEnabled(true);
    setCastEnabled(true);
    currentFish = null;
    return;
  }

  let bonus = 0;
  let helperText = "";
  let helperNameClean = "";

  if(withHelp){
    helperNameClean = $("helperName").value.trim();
    if(!helperNameClean){ alert("你得输入一个名字。"); show(helpEl); return; }
    if(helperNameClean === player.name){ alert("你不能叫自己来帮忙。"); show(helpEl); return; }

    bonus = 2;
    helperText = `<div>你叫来了 <b>${helperNameClean}</b> 帮忙（+2）</div>`;
  }

  hide(helpEl);

  const total = player.str + bonus;
  const success = total >= currentFish.need;

  resultEl.innerHTML += `
    <hr>
    ${helperText}
    <div>判定需求：${currentFish.need}</div>
    <div>你的力量：${total}</div>
    <br>
    <b>${success ? "成功钓上来！" : "鱼挣脱了……"}</b>
  `;

  addLogItem(`
    <div>
      <span class="pill ${success ? "success" : "fail"}">
        ${success ? "成功钓上来" : "没拉住"}
      </span>
      ${player.name}：${currentFish.name}（${currentFish.length}cm）
    </div>
    ${withHelp ? `<div class="muted">帮手：${helperNameClean}（+2）</div>` : ``}
  `);

  $("helperName").value = "";
  currentFish = null;

  setCastEnabled(true);
  setQuitEnabled(true);
}

/* 两按钮 */
function fishAllDay(){
  castsLeft = 5;
  updateCastsUI();

  showFishingUI();
  $("result").innerHTML = `<div><b>你决定继续钓。</b>（节目组：行，随你。）</div>`;
  addLogItem(`<div><span class="pill">加时</span>${player.name || "某人"}：我非要钓一天！</div>`);

  setCastEnabled(true);
  setQuitEnabled(true);
}

function wrapUp(){
  addLogItem(`<div><span class="pill">收工</span>${player.name || "某人"}：差不多回去了。</div>`);
  alert("那你关闭网页啊！记得截图！");
}

function quitNow(){
  addLogItem(`<div><span class="pill">收工</span>${player.name || "某人"}：不玩了，走了。</div>`);
  alert("那你关闭网页啊！记得截图！");
}

/* init */
updateCastsUI();
setCastEnabled(true);
setQuitEnabled(true);

</script>

</body>
</html>
